<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級座位表生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root{ --brand:#4f46e5; --brand2:#7c3aed; }
        html,body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;}
        body{
            background:
              radial-gradient(1200px 600px at -10% -10%, #eef2ff 0%, transparent 60%),
              radial-gradient(1000px 600px at 110% -10%, #faf5ff 0%, transparent 60%),
              #f7f8fc;
            min-height:100vh;
        }

        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:600;padding:.55rem .9rem;border-radius:.6rem;
             box-shadow:0 1px 2px rgba(0,0,0,.05);transition:transform .08s ease, box-shadow .15s ease, background .15s, filter .15s;}
        .btn:active{transform:translateY(1px);}
        .btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;}
        .btn-primary:hover{filter:brightness(1.08);box-shadow:0 6px 14px -4px rgba(99,102,241,.5);}
        .btn-soft{background:#fff;color:#374151;border:1px solid #e5e7eb;}
        .btn-soft:hover{background:#f9fafb;border-color:#d1d5db;}
        .btn-danger{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;}
        .btn-danger:hover{background:#fecaca;}
        .btn-success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;}
        .btn-success:hover{background:#bbf7d0;}
        .pill{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:9999px;font-size:.75rem;font-weight:600;}

        .platform{
            position:relative;
            width:88%;max-width:680px;height:54px;margin:0 auto 26px;
            background:linear-gradient(180deg,#ffffff,#f1f5f9);
            border:3px solid #1e293b;border-radius:8px;
            display:flex;align-items:center;justify-content:center;
            font-weight:800;letter-spacing:6px;color:#1e293b;
            box-shadow:0 6px 14px -8px rgba(0,0,0,.25), inset 0 0 0 4px #fff;
        }
        .platform::before,.platform::after{
            content:"";position:absolute;bottom:-12px;width:4px;height:12px;background:#1e293b;border-radius:0 0 2px 2px;
        }
        .platform::before{left:18%;} .platform::after{right:18%;}

        #classroom{
            position:relative;
            width:100%;
            aspect-ratio:16/10;
            background:#f8faff;
            background-image:
              repeating-linear-gradient(0deg, transparent 0 39px, rgba(99,102,241,.06) 39px 40px),
              repeating-linear-gradient(90deg, transparent 0 39px, rgba(99,102,241,.06) 39px 40px);
            border:2px dashed #e0e7ff;
            border-radius:14px;
            overflow:hidden;
            touch-action:none;
        }
        .desk{
            position:absolute;
            width:104px;
            height:80px;
            transform:translate(-50%,-50%);
            border-radius:14px;
            background:#ffffff;
            border:2px solid #e5e7eb;
            display:flex;align-items:center;justify-content:center;
            text-align:center;padding:.4rem;
            cursor:grab;user-select:none;
            transition:box-shadow .15s ease, border-color .15s, background .15s, opacity .2s;
            box-shadow:0 1px 2px rgba(15,23,42,.04);
            touch-action:none;
        }
        .desk:hover{box-shadow:0 8px 18px -8px rgba(15,23,42,.25);border-color:#c7d2fe;z-index:2;}
        .desk.empty{background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f3f4f6 6px,#f3f4f6 12px);}
        .desk.empty .name{color:#9ca3af;font-weight:500;font-size:.8rem;}
        .desk.disabled{background:#f1f5f9 !important;border-style:dashed;border-color:#cbd5e1 !important;cursor:not-allowed;}
        .desk.disabled .name{color:#94a3b8;font-size:.8rem;}
        .desk.dragging{opacity:.85;cursor:grabbing;z-index:10;box-shadow:0 14px 28px -8px rgba(0,0,0,.3);}
        .desk.drop-target{border-color:var(--brand) !important;box-shadow:0 0 0 4px rgba(99,102,241,.25) !important;}
        .desk.locked::after{content:"🔒";position:absolute;top:2px;right:4px;font-size:.75rem;}
        .desk.dimmed{opacity:.25;}
        .desk.highlight{box-shadow:0 0 0 4px #fde68a, 0 8px 18px -8px rgba(0,0,0,.18);border-color:#f59e0b;z-index:3;}
        .desk .name{font-weight:700;font-size:.95rem;color:#1f2937;line-height:1.2;word-break:break-word;}
        .desk .seat-no{position:absolute;top:2px;left:4px;font-size:.6rem;color:#9ca3af;font-weight:600;}

        .desk[data-color="1"]{background:#eef2ff;border-color:#c7d2fe;}
        .desk[data-color="2"]{background:#fef3c7;border-color:#fde68a;}
        .desk[data-color="3"]{background:#dcfce7;border-color:#bbf7d0;}
        .desk[data-color="4"]{background:#fce7f3;border-color:#fbcfe8;}
        .desk[data-color="5"]{background:#ffe4e6;border-color:#fecdd3;}

        @media (max-width:640px){
            .desk{width:84px;height:68px;}
            .desk .name{font-size:.8rem;}
        }

        .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(4px);}
        .modal{background:#fff;border-radius:16px;padding:1.2rem 1.3rem;width:92%;max-width:420px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);}
        .swatch{width:30px;height:30px;border-radius:50%;border:2px solid #e5e7eb;cursor:pointer;transition:transform .1s;}
        .swatch:hover{transform:scale(1.1);}
        .swatch.selected{box-shadow:0 0 0 3px #4f46e5;}

        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:.6rem 1rem;border-radius:9999px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:80;}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

        @media print{
            @page{size:A4 landscape;margin:10mm;}
            body{background:#fff !important;}
            .no-print{display:none !important;}
            #printArea{box-shadow:none !important;border:none !important;padding:0 !important;max-width:100% !important;}
            #classroom{background:#fff !important;background-image:none !important;border:1px solid #cbd5e1 !important;}
            .desk{break-inside:avoid;border:2px solid #111 !important;background:#fff !important;box-shadow:none !important;}
            .desk.disabled{border-style:dashed !important;background:#f5f5f5 !important;}
            .desk.empty{background:#fff !important;}
            .desk[data-color]{background:#fff !important;}
        }

        .layout{display:grid;grid-template-columns:300px 1fr;gap:24px;max-width:1400px;margin:0 auto;}
        @media (max-width:900px){.layout{grid-template-columns:1fr;}}

        details>summary{cursor:pointer;list-style:none;}
        details>summary::-webkit-details-marker{display:none;}
        details>summary .chev{display:inline-block;transition:transform .2s;}
        details[open]>summary .chev{transform:rotate(90deg);}
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8">

<header class="no-print max-w-[1400px] mx-auto mb-6 flex items-center justify-between flex-wrap gap-3">
    <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 grid place-items-center text-white shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </div>
        <div>
            <h1 class="text-xl md:text-2xl font-black tracking-tight">課室座位表生成器</h1>
            <p class="text-xs text-slate-500">點按座位即可編輯・拖曳交換・支援 iPad 觸控・自動儲存</p>
        </div>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
        <span id="statBox" class="pill bg-white border border-slate-200 text-slate-600">學生 0 / 座位 0</span>
        <button onclick="undo()" id="undoBtn" class="btn btn-soft" title="復原 (Ctrl+Z)">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
            復原
        </button>
        <button onclick="window.print()" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
            列印
        </button>
    </div>
</header>

<div class="layout">
    <aside class="no-print bg-white rounded-2xl shadow-sm border border-slate-200 p-4 self-start lg:sticky lg:top-4 max-h-[calc(100vh-2rem)] overflow-y-auto">

        <details open class="mb-3">
            <summary class="flex items-center justify-between font-bold text-slate-700 mb-2">
                <span class="flex items-center gap-2"><span class="chev">▸</span>📐 教室格局</span>
            </summary>
            <div class="space-y-2 pl-1">
                <div>
                    <label class="block text-xs text-slate-500 mb-1">座位數量</label>
                    <div class="flex gap-2">
                        <input type="number" id="seatCountInput" value="30" min="1" max="100" class="flex-1 border rounded-lg px-2 py-1.5 text-center">
                        <button onclick="applySeatCount()" class="btn btn-success px-3">套用</button>
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1">座位可自由拖曳到任何位置，不受格子限制</p>
                </div>

                <div class="border-t pt-2 mt-2">
                    <label class="block text-xs text-slate-500 mb-1">每行幾個（用於整齊排列）</label>
                    <div class="flex gap-2">
                        <input type="number" id="arrangeColsInput" value="6" min="1" max="20" class="flex-1 border rounded-lg px-2 py-1.5 text-center">
                        <button onclick="arrangeGrid()" class="btn btn-soft px-3" title="重新排列成整齊網格">📏 排列</button>
                    </div>
                </div>

                <label class="flex items-center gap-2 text-sm pt-1">
                    <input type="checkbox" id="seatNoToggle" class="w-4 h-4 accent-indigo-600">
                    <span>顯示座位編號</span>
                </label>
            </div>
        </details>

        <details open class="mb-3">
            <summary class="flex items-center justify-between font-bold text-slate-700 mb-2">
                <span class="flex items-center gap-2"><span class="chev">▸</span>👥 學生資料</span>
            </summary>
            <div class="space-y-2 pl-1">
                <label class="block text-xs text-slate-500">匯入 Excel（A 欄為姓名）</label>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="block w-full text-xs text-slate-500
                  file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0
                  file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"/>
                <div class="text-center text-xs text-slate-400">— 或 —</div>
                <button onclick="openBulkAdd()" class="btn btn-soft w-full">✏️ 貼上名單</button>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportExcel()" class="btn btn-soft">⬇️ 匯出</button>
                    <button onclick="clearAll()" class="btn btn-danger">🗑 清空</button>
                </div>
            </div>
        </details>

        <details open class="mb-3">
            <summary class="flex items-center justify-between font-bold text-slate-700 mb-2">
                <span class="flex items-center gap-2"><span class="chev">▸</span>🛠 排座工具</span>
            </summary>
            <div class="space-y-2 pl-1">
                <button onclick="shuffleSeats()" class="btn btn-primary w-full">🎲 隨機排座</button>
                <label class="flex items-center gap-2 text-xs text-slate-600">
                    <input type="checkbox" id="keepLocked" class="w-4 h-4 accent-indigo-600" checked>
                    <span>保留已鎖定學生位置</span>
                </label>
                <button onclick="sortByName()" class="btn btn-soft w-full">🔤 依姓名排序</button>
                <button onclick="reverseRows()" class="btn btn-soft w-full">🔄 前後對調</button>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">🔍 搜尋學生（聚光）</label>
                    <input type="text" id="searchInput" placeholder="輸入姓名…" class="w-full border rounded-lg px-2 py-1.5 text-sm">
                </div>
            </div>
        </details>

        <details class="mb-1">
            <summary class="flex items-center justify-between font-bold text-slate-700 mb-2">
                <span class="flex items-center gap-2"><span class="chev">▸</span>💾 多個座位表</span>
            </summary>
            <div class="space-y-2 pl-1">
                <button onclick="savePreset()" class="btn btn-success w-full">儲存目前為新座位表</button>
                <select id="presetSelect" class="w-full border rounded-lg px-2 py-1.5 text-sm"></select>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="loadPreset()" class="btn btn-soft text-sm">載入</button>
                    <button onclick="deletePreset()" class="btn btn-danger text-sm">刪除</button>
                </div>
            </div>
        </details>

        <p class="text-[11px] text-slate-400 mt-3 leading-relaxed">
            提示：<br>
            ・點按座位 → 編輯姓名 / 鎖定 / 標色 / 停用<br>
            ・拖曳座位 → 自由移動到任何位置（支援滑鼠、iPad 觸控）<br>
            ・拖到另一個座位 → 互換學生（位置保留）
        </p>
    </aside>

    <main>
        <div id="printArea" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 min-h-[600px]">
            <div class="text-center mb-6">
                <h2 id="pageTitle" contenteditable="true" spellcheck="false"
                    class="text-3xl md:text-4xl font-black text-slate-800 border-b-2 border-transparent hover:border-slate-300 focus:border-indigo-400 inline-block px-3 py-1 outline-none">
                    班級座位表
                </h2>
                <div>
                    <p id="pageSubtitle" contenteditable="true" spellcheck="false"
                       class="text-slate-500 mt-1 border-b border-transparent hover:border-slate-300 focus:border-indigo-400 inline-block px-2 outline-none">
                        點擊輸入日期或班別
                    </p>
                </div>
            </div>

            <div class="platform">白&nbsp;&nbsp;板&nbsp;&nbsp;Whiteboard</div>

            <div id="classroom"></div>

            <div class="mt-6 text-center text-xs text-slate-400 print:text-slate-500">
                <span id="footerStat"></span>
            </div>
        </div>
    </main>
</div>

<!-- Seat Edit Modal -->
<div id="seatModal" class="modal-backdrop hidden">
    <div class="modal">
        <h3 class="font-bold text-lg mb-3">編輯座位 <span id="modalSeatNo" class="text-xs text-slate-400 font-normal"></span></h3>
        <label class="block text-xs text-slate-500 mb-1">學生姓名（留空 = 空位）</label>
        <input type="text" id="modalNameInput" class="w-full border rounded-lg px-3 py-2 mb-3" autocomplete="off">

        <div class="mb-3">
            <div class="text-xs text-slate-500 mb-1">標色（分組／提醒）</div>
            <div id="modalColors" class="flex gap-2">
                <div class="swatch" data-c="0" style="background:#fff"></div>
                <div class="swatch" data-c="1" style="background:#c7d2fe"></div>
                <div class="swatch" data-c="2" style="background:#fde68a"></div>
                <div class="swatch" data-c="3" style="background:#bbf7d0"></div>
                <div class="swatch" data-c="4" style="background:#fbcfe8"></div>
                <div class="swatch" data-c="5" style="background:#fecdd3"></div>
            </div>
        </div>

        <div class="flex flex-wrap gap-3 mb-4 text-sm">
            <label class="flex items-center gap-1.5"><input type="checkbox" id="modalLock" class="w-4 h-4 accent-indigo-600">🔒 鎖定（不被隨機）</label>
            <label class="flex items-center gap-1.5"><input type="checkbox" id="modalDisable" class="w-4 h-4 accent-slate-600">🚫 停用（無座位）</label>
        </div>

        <div class="flex justify-end gap-2">
            <button onclick="closeSeatModal()" class="btn btn-soft">取消</button>
            <button onclick="applySeatModal()" class="btn btn-primary">儲存</button>
        </div>
    </div>
</div>

<!-- Bulk Add Modal -->
<div id="bulkModal" class="modal-backdrop hidden">
    <div class="modal">
        <h3 class="font-bold text-lg mb-2">貼上學生名單</h3>
        <p class="text-xs text-slate-500 mb-2">每行一個名字（會覆蓋現有名單，並自動填入空位）</p>
        <textarea id="bulkText" rows="10" class="w-full border rounded-lg p-2 text-sm" placeholder="陳大文&#10;李小明&#10;王美麗"></textarea>
        <div class="flex justify-end gap-2 mt-3">
            <button onclick="closeBulkAdd()" class="btn btn-soft">取消</button>
            <button onclick="applyBulkAdd()" class="btn btn-primary">套用</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============== State ============== */
// seat = { id, name, color:0-5, locked:bool, disabled:bool, x:%, y:% }
let seats = [];
let history = [];
const HISTORY_LIMIT = 30;
let nextId = 1;

const classroom        = document.getElementById('classroom');
const fileInput        = document.getElementById('fileInput');
const seatCountInput   = document.getElementById('seatCountInput');
const arrangeColsInput = document.getElementById('arrangeColsInput');
const seatNoToggle     = document.getElementById('seatNoToggle');
const searchInput      = document.getElementById('searchInput');

let editingIndex = null, editingColor = 0;
let drag = null;

/* ============== Helpers ============== */
function emptySeat(x=50,y=50){return {id:nextId++,name:"",color:0,locked:false,disabled:false,x,y};}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1700);}
function pushHistory(){
    history.push(JSON.stringify({seats,nextId}));
    if(history.length>HISTORY_LIMIT) history.shift();
}
function undo(){
    if(!history.length) return toast("沒有可復原的操作");
    const st = JSON.parse(history.pop());
    seats = st.seats; nextId = st.nextId;
    seatCountInput.value = seats.length;
    renderSeats(); saveData(); toast("已復原");
}

function gridPos(i, total, cols){
    const rows = Math.max(1, Math.ceil(total/cols));
    const r = Math.floor(i/cols), c = i%cols;
    const xL=8, xR=92, yT=10, yB=92;
    const cellW = (xR-xL)/cols, cellH = (yB-yT)/rows;
    return { x: xL + cellW*c + cellW/2, y: yT + cellH*r + cellH/2 };
}

/* ============== Init ============== */
window.addEventListener('load',()=>{
    const cfg = JSON.parse(localStorage.getItem('seatingConfig')||'null');
    const data = JSON.parse(localStorage.getItem('seatingData')||'null');
    if(cfg){
        if(cfg.title) document.getElementById('pageTitle').innerText = cfg.title;
        if(cfg.subtitle) document.getElementById('pageSubtitle').innerText = cfg.subtitle;
        if(cfg.arrangeCols) arrangeColsInput.value = cfg.arrangeCols;
        seatNoToggle.checked = !!cfg.seatNo;
    }
    if(Array.isArray(data) && data.length){
        const first = data[0];
        const hasFreePos = (typeof first==='object' && first && 'x' in first && 'y' in first);
        if(hasFreePos){
            seats = data.map(d=>({id:0,name:"",color:0,locked:false,disabled:false,x:50,y:50,...d}));
            seats.forEach(s=>{ if(!s.id) s.id = nextId++; });
            nextId = Math.max(nextId, ...seats.map(s=>s.id||0)) + 1;
        } else {
            // legacy grid migration
            const cols = +(cfg && cfg.columns) || 6;
            const total = data.length;
            seats = data.map((d,i)=>{
                const base = (typeof d==='string') ? {name:d} : d;
                const p = gridPos(i,total,cols);
                return {id:nextId++,name:"",color:0,locked:false,disabled:false,x:p.x,y:p.y,...base};
            });
        }
        seatCountInput.value = seats.length;
        renderSeats();
    } else {
        seatCountInput.value = 30;
        applySeatCount(false);
    }
    refreshPresetList();
});

['pageTitle','pageSubtitle'].forEach(id=>document.getElementById(id).addEventListener('input',saveData));
seatNoToggle.addEventListener('change',()=>{renderSeats();saveData();});
searchInput.addEventListener('input',applySearch);
document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z' && !isInModalInput(e.target)){e.preventDefault();undo();}
});
function isInModalInput(t){return t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);}

document.addEventListener('pointermove', onPointerMove);
document.addEventListener('pointerup', onPointerUp);
document.addEventListener('pointercancel', onPointerUp);

/* ============== Excel ============== */
fileInput.addEventListener('change',e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
        const wb = XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet,{header:1});
        let names = json.map(r => (r&&r[0]!=null)?String(r[0]).trim():"").filter(n=>n!=="");
        if(!names.length){alert("檔案為空，請確保姓名在 A 欄。");fileInput.value="";return;}
        if(!confirm(`成功讀取 ${names.length} 位學生，是否覆蓋目前座位表？`)){fileInput.value="";return;}
        loadNames(names);
        fileInput.value = "";
    };
    reader.readAsArrayBuffer(file);
});

function loadNames(names){
    pushHistory();
    if(names.length > seats.length){
        const cols = Math.max(1,+arrangeColsInput.value||6);
        const total = names.length;
        for(let i=seats.length;i<total;i++){
            const p = gridPos(i,total,cols);
            seats.push(emptySeat(p.x,p.y));
        }
        seatCountInput.value = seats.length;
    }
    seats.forEach(s=>{ s.name=""; });
    names.forEach((n,i)=>{ if(i<seats.length) seats[i].name = n; });
    renderSeats(); saveData();
    toast(`已載入 ${names.length} 位學生`);
}

function exportExcel(){
    const names = seats.filter(s=>s.name).map(s=>[s.name]);
    if(!names.length) return alert("目前沒有學生資料！");
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(names), "座位表");
    const title = (document.getElementById('pageTitle').innerText.trim() || "座位表").replace(/[\\/:*?"<>|]/g,'_');
    XLSX.writeFile(wb, `${title}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ============== Seat count / arrange ============== */
function applySeatCount(record=true){
    const n = Math.max(1, Math.min(100, +seatCountInput.value || 30));
    seatCountInput.value = n;
    if(n === seats.length){ renderSeats(); saveData(); return; }
    if(record) pushHistory();
    if(n > seats.length){
        const cols = Math.max(1,+arrangeColsInput.value||6);
        for(let i=seats.length;i<n;i++){
            const p = gridPos(i,n,cols);
            seats.push(emptySeat(p.x,p.y));
        }
    } else {
        const removed = seats.slice(n);
        if(removed.some(s=>s.name)){
            if(!confirm(`減少到 ${n} 個座位會刪除最後 ${seats.length-n} 個座位（含學生姓名），確定？`)){
                seatCountInput.value = seats.length;
                if(record) history.pop();
                return;
            }
        }
        seats = seats.slice(0,n);
    }
    renderSeats(); saveData();
    if(record) toast(`座位數量：${n}`);
}

function arrangeGrid(){
    if(!seats.length) return;
    const cols = Math.max(1, +arrangeColsInput.value || 6);
    pushHistory();
    seats.forEach((s,i)=>{const p=gridPos(i,seats.length,cols);s.x=p.x;s.y=p.y;});
    renderSeats(); saveData(); toast("已整齊排列");
}

/* ============== Render ============== */
function setDeskPos(desk, seat){
    desk.style.left = seat.x + '%';
    desk.style.top  = seat.y + '%';
}

function renderSeats(){
    const showSeatNo = seatNoToggle.checked;
    classroom.innerHTML = '';
    seats.forEach((seat,idx)=>{
        const desk = document.createElement('div');
        desk.className = 'desk';
        desk.dataset.index = idx;
        if(seat.color) desk.dataset.color = seat.color;
        if(seat.locked) desk.classList.add('locked');
        if(seat.disabled) desk.classList.add('disabled');
        else if(!seat.name) desk.classList.add('empty');
        setDeskPos(desk, seat);
        const labelHtml = seat.disabled
            ? `<div class="name">無座位</div>`
            : seat.name
                ? `<div class="name">${escapeHtml(seat.name)}</div>`
                : `<div class="name">空位</div>`;
        const seatNoHtml = showSeatNo ? `<span class="seat-no">${idx+1}</span>` : '';
        desk.innerHTML = seatNoHtml + labelHtml;
        desk.addEventListener('pointerdown', e=>onPointerDown(e,idx));
        classroom.appendChild(desk);
    });
    updateStats(); applySearch();
}

function updateStats(){
    const total = seats.filter(s=>!s.disabled).length;
    const filled = seats.filter(s=>s.name && !s.disabled).length;
    const disabled = seats.filter(s=>s.disabled).length;
    document.getElementById('statBox').textContent = `學生 ${filled} / 座位 ${total}`;
    document.getElementById('footerStat').textContent =
        `共 ${filled} 位學生・${total} 個座位` + (disabled?`・${disabled} 個停用`:'');
}

/* ============== Drag (pointer events: mouse + touch + pen) ============== */
function onPointerDown(e, idx){
    if(e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const desk = e.currentTarget;
    const isDisabled = seats[idx].disabled;
    const dRect = desk.getBoundingClientRect();
    drag = {
        idx, desk,
        startSeatX: seats[idx].x, startSeatY: seats[idx].y,
        offsetX: e.clientX - (dRect.left + dRect.width/2),
        offsetY: e.clientY - (dRect.top + dRect.height/2),
        startClientX: e.clientX, startClientY: e.clientY,
        moved:false, pointerId:e.pointerId, locked: isDisabled
    };
    if(!isDisabled){
        try{ desk.setPointerCapture(e.pointerId); }catch(_){}
        desk.classList.add('dragging');
    }
}

function onPointerMove(e){
    if(!drag || drag.locked) return;
    const dx = e.clientX - drag.startClientX;
    const dy = e.clientY - drag.startClientY;
    if(!drag.moved && Math.hypot(dx,dy) < 4) return;
    drag.moved = true;
    const rect = classroom.getBoundingClientRect();
    if(rect.width === 0) return;
    const cx = e.clientX - drag.offsetX;
    const cy = e.clientY - drag.offsetY;
    let xPct = ((cx - rect.left)/rect.width)*100;
    let yPct = ((cy - rect.top )/rect.height)*100;
    xPct = Math.max(2, Math.min(98, xPct));
    yPct = Math.max(2, Math.min(98, yPct));
    seats[drag.idx].x = xPct;
    seats[drag.idx].y = yPct;
    setDeskPos(drag.desk, seats[drag.idx]);
    drag.desk.style.pointerEvents='none';
    const target = document.elementFromPoint(e.clientX,e.clientY);
    drag.desk.style.pointerEvents='';
    document.querySelectorAll('.desk.drop-target').forEach(d=>d.classList.remove('drop-target'));
    const t = target ? target.closest('.desk') : null;
    if(t && t!==drag.desk && !t.classList.contains('disabled')) t.classList.add('drop-target');
}

function onPointerUp(e){
    if(!drag) return;
    const desk = drag.desk;
    desk.classList.remove('dragging');
    document.querySelectorAll('.desk.drop-target').forEach(d=>d.classList.remove('drop-target'));
    if(!drag.moved){
        const idx = drag.idx;
        drag = null;
        openSeatModal(idx);
        return;
    }
    desk.style.pointerEvents='none';
    const target = document.elementFromPoint(e.clientX,e.clientY);
    desk.style.pointerEvents='';
    const t = target ? target.closest('.desk') : null;
    pushHistory();
    if(t && t!==desk && !t.classList.contains('disabled')){
        const otherIdx = +t.dataset.index;
        const a = seats[drag.idx], b = seats[otherIdx];
        // swap student data, restore the dragged seat to its original position
        a.x = drag.startSeatX; a.y = drag.startSeatY;
        const ad = {name:a.name,color:a.color,locked:a.locked};
        a.name=b.name; a.color=b.color; a.locked=b.locked;
        b.name=ad.name; b.color=ad.color; b.locked=ad.locked;
    }
    drag = null;
    renderSeats(); saveData();
}

/* ============== Seat ops ============== */
function shuffleSeats(){
    const keepLocked = document.getElementById('keepLocked').checked;
    pushHistory();
    const idxs = seats.map((s,i)=>i).filter(i=>!seats[i].disabled && !(keepLocked && seats[i].locked));
    const datas = idxs.map(i=>({name:seats[i].name,color:seats[i].color,locked:seats[i].locked}));
    for(let i=datas.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[datas[i],datas[j]]=[datas[j],datas[i]];}
    idxs.forEach((origIdx,k)=>{const d=datas[k];seats[origIdx].name=d.name;seats[origIdx].color=d.color;seats[origIdx].locked=d.locked;});
    renderSeats(); saveData(); toast("已隨機排座");
}

function sortByName(){
    pushHistory();
    const idxs = seats.map((s,i)=>i).filter(i=>!seats[i].disabled);
    // reading order: top→bottom, left→right (group rows by Y proximity)
    idxs.sort((a,b)=>{
        const sa=seats[a], sb=seats[b];
        if(Math.abs(sa.y - sb.y) > 8) return sa.y - sb.y;
        return sa.x - sb.x;
    });
    const datas = idxs.map(i=>({name:seats[i].name,color:seats[i].color,locked:seats[i].locked}));
    datas.sort((a,b)=>{
        if(!a.name && !b.name) return 0;
        if(!a.name) return 1; if(!b.name) return -1;
        return a.name.localeCompare(b.name,'zh-Hant');
    });
    idxs.forEach((origIdx,k)=>{const d=datas[k];seats[origIdx].name=d.name;seats[origIdx].color=d.color;seats[origIdx].locked=d.locked;});
    renderSeats(); saveData(); toast("已依姓名排序");
}

function reverseRows(){
    pushHistory();
    seats.forEach(s=>{s.y = 100 - s.y;});
    renderSeats(); saveData(); toast("已前後對調");
}

function clearAll(){
    if(!confirm("確定清空所有學生姓名？（座位佈局將保留）")) return;
    pushHistory();
    seats.forEach(s=>{s.name="";s.color=0;s.locked=false;});
    renderSeats(); saveData(); toast("已清空學生資料");
}

/* ============== Search ============== */
function applySearch(){
    const q = (searchInput.value||"").trim().toLowerCase();
    document.querySelectorAll('.desk').forEach(d=>{
        d.classList.remove('highlight','dimmed');
        if(!q) return;
        const idx = +d.dataset.index;
        const name = (seats[idx]?.name||"").toLowerCase();
        if(name && name.includes(q)) d.classList.add('highlight');
        else d.classList.add('dimmed');
    });
}

/* ============== Modal: edit seat ============== */
function openSeatModal(i){
    editingIndex = i;
    const s = seats[i];
    editingColor = s.color||0;
    document.getElementById('modalSeatNo').textContent = `#${i+1}`;
    document.getElementById('modalNameInput').value = s.name||"";
    document.getElementById('modalLock').checked = !!s.locked;
    document.getElementById('modalDisable').checked = !!s.disabled;
    document.querySelectorAll('#modalColors .swatch').forEach(sw=>{
        sw.classList.toggle('selected', +sw.dataset.c===editingColor);
    });
    document.getElementById('seatModal').classList.remove('hidden');
    setTimeout(()=>document.getElementById('modalNameInput').focus(),50);
}
function closeSeatModal(){editingIndex=null;document.getElementById('seatModal').classList.add('hidden');}
function applySeatModal(){
    if(editingIndex==null) return;
    pushHistory();
    const isDisabled = document.getElementById('modalDisable').checked;
    const s = seats[editingIndex];
    s.name = isDisabled ? "" : document.getElementById('modalNameInput').value.trim();
    s.color = editingColor;
    s.locked = !isDisabled && document.getElementById('modalLock').checked;
    s.disabled = isDisabled;
    closeSeatModal();
    renderSeats(); saveData();
}
document.querySelectorAll('#modalColors .swatch').forEach(sw=>{
    sw.addEventListener('click',()=>{
        editingColor = +sw.dataset.c;
        document.querySelectorAll('#modalColors .swatch').forEach(x=>x.classList.toggle('selected',x===sw));
    });
});
document.getElementById('seatModal').addEventListener('click',e=>{if(e.target.id==='seatModal') closeSeatModal();});
document.getElementById('modalNameInput').addEventListener('keydown',e=>{if(e.key==='Enter') applySeatModal();else if(e.key==='Escape') closeSeatModal();});

/* ============== Bulk add ============== */
function openBulkAdd(){
    document.getElementById('bulkText').value=seats.filter(s=>s.name).map(s=>s.name).join('\n');
    document.getElementById('bulkModal').classList.remove('hidden');
    setTimeout(()=>document.getElementById('bulkText').focus(),50);
}
function closeBulkAdd(){document.getElementById('bulkModal').classList.add('hidden');}
function applyBulkAdd(){
    const names = document.getElementById('bulkText').value.split('\n').map(n=>n.trim()).filter(Boolean);
    closeBulkAdd();
    if(!names.length) return;
    loadNames(names);
}
document.getElementById('bulkModal').addEventListener('click',e=>{if(e.target.id==='bulkModal') closeBulkAdd();});

/* ============== Save / Presets ============== */
function saveData(){
    localStorage.setItem('seatingData', JSON.stringify(seats));
    localStorage.setItem('seatingConfig', JSON.stringify({
        title:document.getElementById('pageTitle').innerText,
        subtitle:document.getElementById('pageSubtitle').innerText,
        arrangeCols: arrangeColsInput.value,
        seatNo: seatNoToggle.checked
    }));
}

function getPresets(){return JSON.parse(localStorage.getItem('seatingPresets')||'{}');}
function setPresets(p){localStorage.setItem('seatingPresets',JSON.stringify(p));}
function refreshPresetList(){
    const sel = document.getElementById('presetSelect');
    const presets = getPresets();
    const keys = Object.keys(presets);
    sel.innerHTML = keys.length
        ? keys.map(k=>`<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('')
        : `<option value="">（尚未儲存）</option>`;
}
function savePreset(){
    const defaultName = document.getElementById('pageTitle').innerText.trim()||"座位表";
    const name = prompt("為此座位表命名：", defaultName);
    if(!name) return;
    const presets = getPresets();
    presets[name] = {
        seats: JSON.parse(JSON.stringify(seats)),
        config:{
            title:document.getElementById('pageTitle').innerText,
            subtitle:document.getElementById('pageSubtitle').innerText,
            arrangeCols:arrangeColsInput.value,
            seatNo:seatNoToggle.checked
        }
    };
    setPresets(presets); refreshPresetList();
    document.getElementById('presetSelect').value = name;
    toast(`已儲存：${name}`);
}
function loadPreset(){
    const name = document.getElementById('presetSelect').value;
    if(!name) return toast("沒有可載入的座位表");
    const p = getPresets()[name]; if(!p) return;
    pushHistory();
    seats = p.seats.map(s=>({id:nextId++,name:"",color:0,locked:false,disabled:false,x:50,y:50,...s,id:nextId-1}));
    seatCountInput.value = seats.length;
    document.getElementById('pageTitle').innerText = p.config.title||"班級座位表";
    document.getElementById('pageSubtitle').innerText = p.config.subtitle||"";
    arrangeColsInput.value = p.config.arrangeCols||6;
    seatNoToggle.checked = !!p.config.seatNo;
    renderSeats(); saveData(); toast(`已載入：${name}`);
}
function deletePreset(){
    const name = document.getElementById('presetSelect').value;
    if(!name) return;
    if(!confirm(`刪除座位表「${name}」？`)) return;
    const presets = getPresets(); delete presets[name]; setPresets(presets);
    refreshPresetList(); toast("已刪除");
}
</script>
